name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-up-to-date:
    name: branch-up-to-date
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify branch contains latest base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if git merge-base --is-ancestor "origin/${BASE_REF}" HEAD; then
            echo "分支已包含最新的 ${BASE_REF}"
          else
            echo "分支未包含最新的 ${BASE_REF}，请先同步主分支再推送 PR" >&2
            exit 1
          fi

  basic-tests:
    name: basic-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend project
        id: backend
        run: |
          if [ -f repair-server/pom.xml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect frontend project
        id: frontend
        run: |
          if [ -f repair-web/package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.backend.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        if: steps.backend.outputs.found == 'true'
        working-directory: repair-server
        run: mvn -B test

      - name: Set up Node.js 20
        if: steps.frontend.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        if: steps.frontend.outputs.found == 'true'
        working-directory: repair-web
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run frontend tests
        if: steps.frontend.outputs.found == 'true'
        working-directory: repair-web
        run: npm test --if-present

      - name: No test projects yet
        if: steps.backend.outputs.found == 'false' && steps.frontend.outputs.found == 'false'
        run: echo "repair-server 与 repair-web 尚无测试工程，本检查作为占位门禁通过。"